<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ec9e0"/>
      <stop offset="100%" stop-color="#0085a1"/>
    </linearGradient>
  </defs>

  <rect width="480" height="480" fill="url(#bg)"/>

  <!-- 装饰性网格 -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 96h480M0 192h480M0 288h480M0 384h480"/>
    <path d="M96 0v480M192 0v480M288 0v480M384 0v480"/>
  </g>

  <!-- 字母 E -->
  <g fill="none" stroke="url(#letter)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 150 H186 V330 H300"/>
    <path d="M186 240 H276"/>
  </g>

  <!-- 底部标识 -->
  <text x="240" y="416" text-anchor="middle"
        font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="26" letter-spacing="6" fill="#ffffff" fill-opacity="0.55">ELIWUNG</text>
</svg>
